name: Workbench tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Keep test data out of the checkout
        shell: bash
        run: echo "WORKBENCH_DATA=$RUNNER_TEMP/workbench-data" >> "$GITHUB_ENV"
      - name: Install the locked Python packages
        run: |
          python -m pip install --disable-pip-version-check --no-input --require-hashes --only-binary :all: -r requirements.lock
      - run: python -m unittest discover -s tests
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --prefix desktop
      - name: Run the desktop unit tests
        shell: bash
        run: node --test tests/*.test.cjs
      - name: Exercise desktop on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:WORKBENCH_PYTHON = (Get-Command python).Source
          node tests/desktop-smoke.cjs
      - name: Exercise sandboxed desktop on Linux
        if: runner.os == 'Linux'
        run: |
          electron="$(node -p 'require("./desktop/node_modules/electron")')"
          sandbox="$(dirname "$electron")/chrome-sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          WORKBENCH_TEST_CLIPBOARD=1 WORKBENCH_PYTHON="$(command -v python)" xvfb-run -a node tests/desktop-smoke.cjs
      - name: Exercise desktop on macOS
        if: runner.os == 'macOS'
        run: WORKBENCH_PYTHON="$(command -v python)" node tests/desktop-smoke.cjs
  lock:
    name: lock (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Keep test data out of the checkout
        shell: bash
        run: echo "WORKBENCH_DATA=$RUNNER_TEMP/workbench-data" >> "$GITHUB_ENV"
      - name: Install the locked Python packages
        run: |
          python -m pip install --disable-pip-version-check --no-input --require-hashes --only-binary :all: -r requirements.lock
      - run: python -m unittest discover -s tests
  kit:
    name: kit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build this commit's kit
        run: python release/build.py --output dist --target ${{ matrix.target }}
      - name: Install with install.sh and run the tests through the installed command
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          sh dist/install.sh --from dist --no-modify-path
          cd "$RUNNER_TEMP"
          "$HOME/.local/bin/workbench" -m unittest discover -s tests
          "$HOME/.local/bin/workbench" -c "import os, runtime; assert str(runtime.DATA).startswith(os.environ['HOME']), runtime.DATA"
      - name: Set up the Linux desktop sandbox as a user would and open the desktop
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/home"
          app="$HOME/.local/lib/agent-workbench"
          export WORKBENCH_DATA="$HOME/.local/share/agent-workbench"
          sh "$app/setup-linux.sh" --sandbox --yes
          electron="$("$HOME/.local/bin/workbench" -c 'import desktop_app; print(desktop_app.executable())' | tail -n 1)"
          WORKBENCH_ELECTRON="$electron" WORKBENCH_PYTHON="$app/.venv-linux/bin/python" xvfb-run -a node "$app/tests/desktop-smoke.cjs"
      - name: Install with install.ps1 and run the tests through the installed command
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:WORKBENCH_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'Agent Workbench'
          $env:WORKBENCH_NO_MODIFY_PATH = '1'
          & .\dist\install.ps1 -From dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Set-Location $env:RUNNER_TEMP
          & (Join-Path $env:WORKBENCH_INSTALL_DIR 'bin\workbench.cmd') -m unittest discover -s tests
          exit $LASTEXITCODE
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell scripts
        run: |
          for script in install.sh workbench.sh setup-linux.sh "Launch Workbench.command"; do
            sh -n "$script"
          done
          shellcheck install.sh workbench.sh setup-linux.sh "Launch Workbench.command"
      - name: Check workflow files
        shell: bash
        run: |
          curl --fail --silent --show-error --location --remote-name https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum --check -
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          ./actionlint
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in 'install.ps1', 'setup-web.ps1') {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Output "${file}: $_" }; $failed = $true }
          }
          if ($failed) { exit 1 }
