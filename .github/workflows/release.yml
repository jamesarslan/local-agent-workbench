name: Release kits
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  check:
    name: check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check that the tag matches the builder's version
        run: test "$GITHUB_REF_NAME" = "v$(python -c 'import sys; sys.path.insert(0, "release"); import build; print(build.VERSION)')"
      - name: Check that the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::The tag points at a commit that is not on main. Merge it to main, then tag the merged commit."
            exit 1
          fi
  test:
    needs: check
    uses: ./.github/workflows/test.yml
  build:
    name: build and attest
    needs: [check, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the kits twice and compare them
        run: |
          python release/build.py --ref "$GITHUB_SHA" --output dist
          python release/build.py --ref "$GITHUB_SHA" --output "$RUNNER_TEMP/again"
          cmp dist/SHA256SUMS "$RUNNER_TEMP/again/SHA256SUMS"
          cat dist/SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Create a draft release for a person to review and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "Agent Workbench ${GITHUB_REF_NAME#v}" \
            --notes "Draft. Replace this text with the hand-written release notes before publishing."
